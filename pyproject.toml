[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonscale"
version = "0.1.0"
description = "Sovereign coding-model benchmark: one prompt, one target dir, deterministic gates, no-LLM score."
requires-python = ">=3.11"
# Runtime: stdlib only, zero dependencies.

[project.optional-dependencies]
dev = ["pytest>=8"]

# Only bench/ is a real package (runs/, scenarios/ are data dirs — flat
# auto-discovery refuses to build when it sees them).
[tool.setuptools.packages.find]
include = ["bench*"]

[tool.pytest.ini_options]
testpaths = ["bench/tests"]
# NOTE: no `-q` in addopts — the grader passes `-q` explicitly to subprocess
# pytest runs; double `-q` becomes `-qq` which suppresses the "N passed"
# summary line, so the grader's regex parses 0 passed and every gate fails.
